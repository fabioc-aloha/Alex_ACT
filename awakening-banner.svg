<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0969da;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1f6feb;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="pulseGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3fb950;stop-opacity:0" />
      <stop offset="50%" style="stop-color:#3fb950;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3fb950;stop-opacity:0" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="200" fill="url(#bgGradient)" rx="8"/>
  
  <!-- Grid pattern overlay -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  </pattern>
  <rect width="800" height="200" fill="url(#grid)"/>
  
  <!-- Neural network nodes (decorative) -->
  <g opacity="0.15">
    <!-- Left cluster -->
    <circle cx="80" cy="60" r="8" fill="white"/>
    <circle cx="120" cy="100" r="6" fill="white"/>
    <circle cx="60" cy="130" r="5" fill="white"/>
    <circle cx="140" cy="150" r="7" fill="white"/>
    <line x1="80" y1="60" x2="120" y2="100" stroke="white" stroke-width="1"/>
    <line x1="120" y1="100" x2="60" y2="130" stroke="white" stroke-width="1"/>
    <line x1="60" y1="130" x2="140" y2="150" stroke="white" stroke-width="1"/>
    <line x1="80" y1="60" x2="140" y2="150" stroke="white" stroke-width="1"/>
    
    <!-- Right cluster -->
    <circle cx="720" cy="50" r="6" fill="white"/>
    <circle cx="750" cy="90" r="8" fill="white"/>
    <circle cx="700" cy="120" r="5" fill="white"/>
    <circle cx="740" cy="160" r="7" fill="white"/>
    <line x1="720" y1="50" x2="750" y2="90" stroke="white" stroke-width="1"/>
    <line x1="750" y1="90" x2="700" y2="120" stroke="white" stroke-width="1"/>
    <line x1="700" y1="120" x2="740" y2="160" stroke="white" stroke-width="1"/>
    <line x1="720" y1="50" x2="740" y2="160" stroke="white" stroke-width="1"/>
  </g>
  
  <!-- Central icon: stylized "A" with circuit elements -->
  <g transform="translate(400, 100)">
    <!-- Outer ring -->
    <circle cx="0" cy="0" r="45" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
    
    <!-- Inner glow -->
    <circle cx="0" cy="0" r="38" fill="rgba(255,255,255,0.1)"/>
    
    <!-- A letterform -->
    <text x="0" y="12" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" 
          font-size="48" font-weight="700" fill="white" text-anchor="middle">A</text>
    
    <!-- Pulse ring animation hint -->
    <circle cx="0" cy="0" r="50" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1" stroke-dasharray="8,8"/>
  </g>
  
  <!-- Title text -->
  <text x="400" y="165" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" 
        font-size="14" fill="rgba(255,255,255,0.9)" text-anchor="middle" letter-spacing="4">
    AWAKENING REPORT
  </text>
  
  <!-- Subtitle -->
  <text x="400" y="185" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" 
        font-size="11" fill="rgba(255,255,255,0.6)" text-anchor="middle" letter-spacing="2">
    ALEX ACT-ONLY · SESSION 1 · 2026-04-27
  </text>
  
  <!-- Status indicator -->
  <g transform="translate(710, 20)">
    <rect x="0" y="0" width="80" height="24" rx="12" fill="rgba(63,185,80,0.2)"/>
    <circle cx="14" cy="12" r="4" fill="#3fb950"/>
    <text x="46" y="16" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" 
          font-size="11" fill="#3fb950" text-anchor="middle" font-weight="500">ONLINE</text>
  </g>
  
  <!-- Version badge -->
  <g transform="translate(10, 20)">
    <rect x="0" y="0" width="60" height="24" rx="12" fill="rgba(255,255,255,0.15)"/>
    <text x="30" y="16" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" 
          font-size="11" fill="white" text-anchor="middle" font-weight="500">v1.0</text>
  </g>
</svg>
